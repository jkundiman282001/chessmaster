<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Subtle Top Highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Chess Piece Gradient -->
    <linearGradient id="piece-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Shadow for piece -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#highlight)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Chess Knight Path -->
  <g filter="url(#drop-shadow)">
    <!-- Main Knight Silhouette -->
    <path d="M 45 49 C 45 50.1 44.1 51 43 51 L 21 51 C 19.9 51 19 50.1 19 49 C 19 47.9 19.9 47 21 47 L 22.5 47 C 23.3 43.5 24 39.5 22.5 37 C 21 34.5 17.5 33 16 30 C 14.5 27 15.5 24 18 22.5 C 20.5 21 21 17.5 21 17.5 C 21 17.5 22.5 18 24 17 C 25.5 16 26.5 13 28.5 13 C 30.5 13 32 14.5 32 16.5 C 33.5 15.5 35.5 15.5 37 17 C 39 19 39.5 21.5 40 24 C 40.5 26.5 41.5 28 42.5 31 C 44 35.5 43.5 42.5 42 47 L 43 47 C 44.1 47 45 47.9 45 49 Z" fill="url(#piece-grad)"/>

    <!-- Mane / Spine Contour Lines -->
    <path d="M 33 20 C 35 22.5 36.5 26 36.5 30 C 36.5 33 35.5 36 34.5 38" fill="none" stroke="#059669" stroke-width="1.75" stroke-linecap="round"/>
    
    <!-- Eye -->
    <circle cx="25" cy="24" r="1.75" fill="#047857"/>

    <!-- Muzzle / Jaw Accent -->
    <path d="M 19 28 C 22 29.5 25 28.5 27 26.5" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Base Trim Line -->
    <line x1="22" y1="46" x2="42" y2="46" stroke="#047857" stroke-width="1.25" stroke-linecap="round"/>
  </g>
</svg>